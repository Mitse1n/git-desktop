name: Bug report / 缺陷报告
description: Report a reproducible problem in GitDesk / 报告可复现的问题
body:
  - type: markdown
    attributes:
      value: Remove private data from logs and screenshots. See SECURITY.md for sensitive reports. English and Chinese are welcome.
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: macOS version, CPU architecture, Swift and Git versions, and GitDesk commit hash.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include a minimal disposable repository or script when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or sanitized Console output / 截图或脱敏日志
